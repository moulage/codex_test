<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电子宠物原型</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container app-shell">
      <header class="topbar">
        <a class="brand-mark" href="/">宠物星球</a>
        <div class="topbar-actions">
        <div class="mode-switch" aria-label="模式切换">
          <span class="mode-pill active">孩子模式</span>
          <a class="mode-pill mode-link" href="/parent.html">家长模式</a>
        </div>
        <button id="logoutBtn" class="secondary-btn" type="button">退出账号</button>
        </div>
      </header>

      <section class="hero-grid">
        <section class="pet-card">
          <div id="playOverlay" class="play-overlay" aria-hidden="true"></div>
          <div class="pet-card-head">
            <div>
              <p class="eyebrow">宠物小屋</p>
              <h1 id="petTitle">小猪准备出发</h1>
            </div>
            <span id="petMoodBadge" class="mood-badge">成长第 1 阶段</span>
          </div>

          <div class="pet-selector">
            <div class="selector-copy">
              <span class="metric-label">当前用户</span>
              <strong id="activeUserLabel">乐乐 的宠物进度</strong>
            </div>
            <select id="userSelect" class="user-select" aria-label="切换用户"></select>
          </div>

          <div id="petStage" class="pet-stage">
            <div class="pet-stage-overlay"></div>
            <div class="pet-hello">你好呀，小伙伴！</div>
            <div class="pet-chip pet-chip-right">
              <span class="chip-title">时段</span>
              <strong id="periodLabel">上午</strong>
            </div>
            <div class="pet-chip pet-chip-left">
              <span class="chip-title">当前宠物</span>
              <strong id="currentPetMiniLabel">宠物 1</strong>
            </div>
            <div id="fireworks" class="fireworks" aria-hidden="true"></div>
            <div id="petCharacter" class="pet-character stage-1 mood-mid" aria-label="宠物成长形象" role="img">
              <div class="pet-portal-ring">
                <div class="pet-portal-core">
                  <img id="petSprite" class="pet-sprite" src="/pet/1-1.webp" alt="宠物第 1 阶段" />
                </div>
              </div>
            </div>
            <div id="monsterArena" class="monster-arena" aria-hidden="true"></div>
            <div id="rewardBurst" class="reward-burst" aria-hidden="true"></div>
          </div>

          <div class="pet-actions">
            <button id="petActionPetting" class="cta-primary" type="button">摸摸宠物</button>
            <button id="petActionPlay" class="cta-secondary" type="button">开心玩耍</button>
          </div>

          <div class="stats-strip">
            <article class="stat-capsule">
              <span class="metric-label">心情值</span>
              <strong id="petMood">0</strong>
              <div class="progress-track">
                <div id="moodBar" class="progress-fill"></div>
              </div>
            </article>
            <article class="stat-capsule">
              <span class="metric-label">星星值</span>
              <strong id="petStars">0</strong>
              <div class="floating-gains">
                <span id="starGain" class="gain star-gain" aria-live="polite"></span>
                <span id="moodGain" class="gain mood-gain" aria-live="polite"></span>
              </div>
            </article>
            <article class="stat-capsule">
              <span class="metric-label">成长分</span>
              <strong id="petScore">0</strong>
              <div class="floating-gains">
                <span id="petScoreGain" class="gain pet-score-gain" aria-live="polite"></span>
              </div>
              <div class="progress-track">
                <div id="petProgressBar" class="progress-fill progress-fill-gold"></div>
              </div>
            </article>
          </div>
        </section>

        <section class="task-card">
          <div class="task-head">
            <div>
              <p class="section-kicker">今日任务</p>
              <h2>今天继续解锁宠物成长</h2>
            </div>
            <div class="task-head-meta">
              <strong id="taskCounter">今天已完成 0 项</strong>
              <span id="taskTabHint">当前显示：日常行为习惯</span>
            </div>
          </div>

          <div id="tabNav" class="tab-nav" role="tablist" aria-label="任务分类">
            <button class="tab-btn active" data-tab="日常行为习惯" type="button" role="tab" aria-selected="true">日常行为</button>
            <button class="tab-btn" data-tab="学习" type="button" role="tab" aria-selected="false">学习</button>
            <button class="tab-btn" data-tab="运动" type="button" role="tab" aria-selected="false">运动</button>
          </div>

          <div id="taskPanels" class="task-panels"></div>
          <p id="message" class="message" aria-live="polite"></p>
        </section>
      </section>

      <section class="collection-board">
        <div class="current-pet-panel">
          <strong id="currentPetLabel">宠物 1 · 第 1 只 · 当前 1 级</strong>
          <p id="collectionHint" class="current-pet-subtitle">已解锁 1/7 只宠物。</p>
          <p id="petHint" class="pet-hint">先完成一个任务，让小猪开始今天的成长冒险。</p>
        </div>
        <div id="collectionList" class="collection-list"></div>
      </section>
    </main>

    <script src="./auth.js"></script>
    <script src="./app.js"></script>
  </body>
</html>

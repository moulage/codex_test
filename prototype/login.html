<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>账号登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container auth-shell">
      <section class="auth-card">
        <div>
          <p class="eyebrow">账号中心</p>
          <h1>登录或注册家庭账号</h1>
          <p class="hero-text">每个账号下的用户、宠物成长和家长设置都会独立保存。</p>
        </div>

        <div class="auth-tabs">
          <button id="loginTab" class="tab-btn active" type="button">登录</button>
          <button id="registerTab" class="tab-btn" type="button">注册</button>
        </div>

        <form id="authForm" class="auth-form">
          <input id="displayNameInput" class="editor-input" type="text" placeholder="家庭名称（注册时填写）" />
          <input id="usernameInput" class="editor-input" type="text" placeholder="账号" />
          <input id="passwordInput" class="editor-input" type="password" placeholder="密码" />
          <button id="submitAuthBtn" type="submit">登录账号</button>
        </form>

        <p class="hero-text">默认演示账号：`demo`，密码：`123456`</p>
        <p id="authMessage" class="message"></p>
      </section>

      <section id="adoptionModal" class="modal-shell hidden" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-card adoption-card" role="dialog" aria-modal="true" aria-labelledby="adoptionTitle">
          <p class="eyebrow">注册成功</p>
          <h2 id="adoptionTitle">选择你的初始宠物</h2>
          <p class="hero-text">下面 7 只宠物都可以领养，选中后会作为这个账号的第一只初始宠物。</p>
          <div id="adoptionPetGrid" class="pet-option-grid"></div>
          <div class="modal-actions">
            <button id="confirmAdoptionBtn" type="button" disabled>确认领养</button>
          </div>
          <p id="adoptionMessage" class="message" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script src="./auth.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
